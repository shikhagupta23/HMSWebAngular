<!-- Breadcrumb -->
  <div class="breadcrumb-bar-two">
    <div class="container">
     <div class="row align-items-center inner-banner justify-content-between">

  <!-- Left: Logo -->
  <div class="col-md-2 col-6">
    <a routerLink="/" class="menu-logo">
      <img src="assets/img/Medipilot360.png" 
           class="img-fluid-header"
           alt="Logo" />
    </a>
  </div>

  <!-- Right: Profile Menu -->
  <div class=" col-6 d-flex justify-content-end">
	<div class="d-flex justify-content-end">
  <div class="topbar-profile">

  <div class="profile-avatar">
    <i class="feather feather-user"></i>
  </div>

  <div class="profile-info d-none d-md-block">
	<div class="hospitalName">{{user.hospitalName}}</div>
    <div class="name">{{ user?.userName }}</div>
    <div class="status">{{ role }}</div>
  </div>

  <i class="fa fa-chevron-down ms-2"></i>

  <!-- Dropdown -->
  <div class="profile-dropdown">
    <a routerLink="/superadmin/change-password">
      <i class="fa-solid fa-lock"></i> Change Password
    </a>
    <a routerLink="/superadmin/profile-setting">
      <i class="fa fa-user-cog"></i> Profile Settings
    </a>
    <a (click)="logout()">
      <i class="fa fa-sign-out-alt"></i> Logout
    </a>
  </div>

</div>
	</div>
  

  </div>

</div>

    </div>
  </div>
  <!-- /Breadcrumb -->
