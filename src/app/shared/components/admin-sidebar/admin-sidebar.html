<!-- Sidebar -->
<div class="app-sidebar">

  <!-- Main Section -->
  <div class="sidebar-section">

    <ul class="sidebar-menu">

      <li *ngFor="let item of menu">

        <!-- =========================
             NORMAL MENU (NO CHILDREN)
        ========================== -->
        <a *ngIf="!item.children && item.route"
           [routerLink]="resolveRoute(item)"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>

        <!-- =========================
             ACTION MENU
        ========================== -->
        <a *ngIf="!item.children && item.action"
           (click)="handleMenuAction(item.action)">
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>

        <!-- =========================
             PARENT MENU (WITH CHILDREN)
        ========================== -->
        <a *ngIf="item.children"
           href="javascript:void(0)"
           (click)="item.expanded = !item.expanded">
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
          <i class="fa fa-chevron-down float-end"
             [class.rotate]="item.expanded"></i>
        </a>

        <!-- =========================
             SUB MENU
        ========================== -->
        <ul *ngIf="item.children && item.expanded"
            class="submenu">
          <li *ngFor="let child of item.children"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }">
            <a [routerLink]="resolveRoute(child)">
              <i [class]="child.icon"></i>
              <span>{{ child.label }}</span>
            </a>
          </li>
        </ul>

      </li>

    </ul>
  </div>

</div>
<!-- /Sidebar -->
