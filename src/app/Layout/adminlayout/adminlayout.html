
<div class="main-wrapper">

  <div class="menu-header"></div>

  <!-- Breadcrumb -->
  <div class="breadcrumb-bar-two">
    <div class="container">
     <div class="row align-items-center inner-banner justify-content-between">

  <!-- Left: Logo -->
  <div class="col-md-2 col-6">
    <a href="/receptionist" class="menu-logo">
      <img src="assets/img/Medipilot360.png"
           class="img-fluid-header"
           alt="Logo" />
    </a>
  </div>

  <!-- Right: Profile Menu -->
  <div class="col-md-2 col-6 d-flex justify-content-end">
    <div class="topbar-profile" (click)="toggleProfileMenu()">

      <div class="profile-avatar">
        <i class="feather feather-user"></i>
      </div>

      <div class="profile-info d-none d-md-block">
        <div class="name">{{user?.userName}}</div>
        <div class="status">{{role}}</div>
      </div>

      <i class="fa fa-chevron-down ms-2"
         [class.rotate]="showProfileMenu"></i>

      <!-- Dropdown -->
      <div class="profile-dropdown" *ngIf="showProfileMenu">
        <a routerLink="/superadmin">
          <i class="fa fa-chart-line"></i> Dashboard
        </a>
        <a routerLink="/superadmin/profile-setting">
          <i class="fa fa-user-cog"></i> Profile Settings
        </a>
        <a (click)="logout()">
          <i class="fa fa-sign-out-alt"></i> Logout
        </a>
      </div>

    </div>
  </div>

</div>

    </div>
  </div>
  <!-- /Breadcrumb -->

  <!-- Page Content -->
  <div class="content p-0">
    <div class="container-fluid p-0 m-0">
      <div class="row p-0 main-layout-row">

        <!-- Sidebar (Fixed) -->
        <div class="col-lg-3 col-xl-2 sidebar-fixed p-0">
          <app-admin-sidebar></app-admin-sidebar>
        </div>

        <!-- Main Content -->
        <div class="col-lg-9 col-xl-10 p-0 content-wrapper">
          <div class="router-scroll">
            <router-outlet></router-outlet>
          </div>
        </div>

      </div>
    </div>
  </div>
  <!-- /Page Content -->

</div>
