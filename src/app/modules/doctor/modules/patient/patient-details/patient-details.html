<div class="appointment-patient">

  <div class="dashboard-header">
    <h3>
      <a (click)="goBack()" class="cursor-pointer">
        <i class="fa-solid fa-arrow-left"></i> Patient Details
      </a>
    </h3>
  </div>

  <div class="patient-wrap">
    <div class="patient-info">
      <img src="assets/img/doctors-dashboard/profile-01.jpg" alt="img">
      <div class="user-patient">
        <h6>#{{ patient.patientViewId }}</h6>
        <h5>{{ patient.fullName }}</h5>
        <ul>
          <li>Age : {{ patient.age }}</li>
          <li>{{ patient.gender }}</li>
          <li>{{ patient.bloodGroup }}</li>
        </ul>
      </div>
    </div>

    <div class="patient-book">
      <p><i class="fa-solid fa-calendar-days"></i> Last Booking</p>
      <p>{{ patient.lastBooking }}</p>
    </div>
  </div>

  <!-- Tabs remain exactly same -->
</div>
