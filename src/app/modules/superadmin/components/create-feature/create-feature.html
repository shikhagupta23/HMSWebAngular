<div class="dashboard-header">
  <h3>Create Feature</h3>
</div>

<div class="table-controls d-flex justify-content-between align-items-center mb-3">
  <div>
    <label class="form-label small me-2">Show</label>
    <select
      class="form-select d-inline-block w-auto"
      [(ngModel)]="pageSize"
      (change)="onPageSizeChange()"
    >
      <option *ngFor="let s of [5, 10, 25, 50]" [value]="s">{{ s }}</option>
    </select>
    <span class="small ms-2">entries</span>
  </div>
  <div class="d-flex align-items-center">
    <div class="input-block dash-search-input">
      <input
        type="text"
        class="form-control"
        placeholder="Search Feature..."
        [(ngModel)]="searchTerm"
        (input)="onSearch()"
      />
      <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
    </div>
    <a class="btn btn-primary ms-2" data-bs-toggle="modal" data-bs-target="#createFeatureModal"
      >+ Add New</a
    >
  </div>
</div>

<div class="table-responsive">
  <table class="table table-hover align-middle">
    <thead class="table-light">
      <tr>
        <th>SR. NO.</th>
        <th>Name</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let f of dataList; let i = index">
        <td>{{ (pageNumber - 1) * pageSize + i + 1 }}</td>
        <td>{{ f.name || f.Name }}</td>
        <td>
          <a class="blue-badge" (click)="onEdit(f)">Edit</a>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="d-flex justify-content-between align-items-center mt-3">
  <div class="text-muted">Showing page {{ pageNumber }} of {{ totalPages }}</div>
  <ul class="pagination mb-0">
    <li class="page-item"><a class="page-link" (click)="previousPage()">&laquo;</a></li>
    <li class="page-item" *ngFor="let p of pages" [class.active]="pageNumber === p">
      <a class="page-link" (click)="goToPage(p)">{{ p }}</a>
    </li>
    <li class="page-item"><a class="page-link" (click)="nextPage()">&raquo;</a></li>
  </ul>
</div>

<!-- Create Feature Modal -->
<div class="modal fade" id="createFeatureModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content rounded-4 border-0 shadow">
      <div class="modal-header">
        <h5 class="modal-title">Add Feature</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" #closeModalBtn></button>
      </div>

      <div class="modal-body">
        <form [formGroup]="featureForm" (ngSubmit)="onSubmit()">
          <div class="row g-3">
            <div class="col-md-12">
              <label class="form-label small fw-semibold"
                >Name <span class="text-danger">*</span></label
              >
              <input type="text" class="form-control" formControlName="name" />
            </div>
          </div>
          <div class="mt-3 d-flex justify-content-end">
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
