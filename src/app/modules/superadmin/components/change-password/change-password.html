<!-- Main Wrapper -->
<div class="main-wrapper">
  <div class="breadcrumb-bar-two">
    <div class="container">
      <div class="row align-items-center inner-banner">
        <div class="col-md-2 col-2">
          <a href="/superadmin" class="menu-logo">
            <img src="assets/img/Medipilot360.png" class="img-fluid-header" alt="Logo" />
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="container">
      <div class="row">
        <div class="col-lg-4 col-xl-3 theiaStickySidebar">
          <app-asidebar></app-asidebar>
          <!-- style="position: fixed; width: 22%; height: 60%;" -->
        </div>
        <div class="col-lg-8 col-xl-9">
          <div class="change-password-card card">
            <div class="card-body">
              <h4 class="card-title">Change Password</h4>
              <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    formControlName="email"
                    placeholder="Enter email"
                  />
                  <div *ngIf="email?.touched && email?.invalid" class="invalid-feedback d-block">
                    <div *ngIf="email?.errors?.['required']">Email is required</div>
                    <div *ngIf="email?.errors?.['email']">Enter a valid email</div>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Old Password</label>
                  <input
                    type="password"
                    class="form-control"
                    formControlName="oldPassword"
                    placeholder="Enter old password"
                  />
                  <div
                    *ngIf="oldPassword?.touched && oldPassword?.invalid"
                    class="invalid-feedback d-block"
                  >
                    <div *ngIf="oldPassword?.errors?.['required']">Old password is required</div>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">New Password</label>
                  <input
                    type="password"
                    class="form-control"
                    formControlName="newPassword"
                    placeholder="Enter new password"
                  />
                  <div
                    *ngIf="newPassword?.touched && newPassword?.invalid"
                    class="invalid-feedback d-block"
                  >
                    <div *ngIf="newPassword?.errors?.['required']">New password is required</div>
                    <div *ngIf="newPassword?.errors?.['minlength']">
                      Password must be at least 6 characters
                    </div>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Confirm New Password</label>
                  <input
                    type="password"
                    class="form-control"
                    formControlName="confirmNewPassword"
                    placeholder="Confirm new password"
                  />
                  <div
                    *ngIf="confirmNewPassword?.touched && (confirmNewPassword?.invalid || form?.errors?.['passwordMismatch'])"
                    class="invalid-feedback d-block"
                  >
                    <div *ngIf="confirmNewPassword?.errors?.['required']">
                      Please confirm new password
                    </div>
                    <div *ngIf="form?.errors?.['passwordMismatch']">Passwords do not match</div>
                  </div>
                </div>

                <div class="d-flex justify-content-end">
                  <button class="btn btn-primary" type="submit" [disabled]="submitting">
                    {{ submitting ? 'Changing...' : 'Change Password' }}
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
